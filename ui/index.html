<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent Seatbelt</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C2410C'/%3E%3Cpath d='M6 8h6l14 16h-6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M6 8h6l14 16h-6z" fill="var(--paper)"/></svg>
      <div>
        <div class="name">Agent Seatbelt</div>
        <div id="status" class="status" role="status"><i></i><span>Watching</span></div>
      </div>
    </div>
    <button id="stop" class="stop" type="button"><span class="stop-ico" aria-hidden="true"></span><span class="stop-txt">STOP</span><span class="stop-sub">all agents</span></button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="now" aria-selected="true">Now</button>
    <button role="tab" data-tab="approve" aria-selected="false">Needs approval <b id="badge" hidden>0</b></button>
    <button role="tab" data-tab="rules" aria-selected="false">Rules</button>
    <button role="tab" data-tab="receipt" aria-selected="false">Receipt</button>
  </nav>

  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
